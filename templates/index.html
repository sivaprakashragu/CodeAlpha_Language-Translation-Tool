<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Departures — Language Translator (Lara API)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="board">
  <div class="board-head">
    <h1>Departures <span>/ Translator</span></h1>
    <div class="clock" id="clock"></div>
  </div>

  <div class="panel">
    <div class="lang-row">
      <div class="lang-cell">
        <label for="sourceLang">From</label>
        <select id="sourceLang"></select>
      </div>
      <button class="swap-btn" id="swapBtn" title="Swap languages" aria-label="Swap languages">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4M7 4L3 8M7 4l4 4"/><path d="M17 8v12m0 0l4-4m-4 4l-4-4"/></svg>
      </button>
      <div class="lang-cell">
        <label for="targetLang">To</label>
        <select id="targetLang"></select>
      </div>
    </div>

    <div class="text-row">
      <div class="text-cell">
        <textarea id="sourceText" placeholder="Type or paste text to translate…" maxlength="4000"></textarea>
        <div class="count"><span id="charCount">0</span>/4000</div>
      </div>
      <div class="text-cell">
        <textarea id="targetText" placeholder="Translation appears here…" readonly></textarea>
        <div class="icon-actions">
          <button class="icon-btn" id="speakBtn" title="Listen" aria-label="Listen to translation" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg>
          </button>
          <button class="icon-btn" id="copyBtn" title="Copy" aria-label="Copy translation" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <div class="status" id="status"></div>
      <button class="translate-btn" id="translateBtn">TRANSLATE</button>
    </div>
  </div>


</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
